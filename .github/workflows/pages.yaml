name: Build and deploy academic homepage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10.14.0'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-tailwind.cjs
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify
      - name: Check output
        run: |
          test "$(cat public/CNAME)" = 'xduaiic.me'
          for page in index about/index research/index publications/index projects/index cv/index contact/index; do
            test -s "public/$page.html"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
