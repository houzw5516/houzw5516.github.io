hugoblox:
  schema: '2.0'
  identity:
    name: 侯志伟
    type: person
    description: '西电研究生，研究方向包括电子设计自动化人工智能、计算光刻与氮化镓功率器件。'
  theme:
    mode: light
    pack: default
    colors:
      primary: '#234b70'
    surfaces:
      background: '#ffffff'
      foreground: '#182631'
      header:
        background: '#ffffff'
      footer:
        background: '#ffffff'
  typography:
    pack: academic
  layout:
    radius: none
    spacing: comfortable
  header:
    enable: true
    style: navbar
    sticky: false
    align: right
    search: false
    theme_toggle: false
    theme_picker: false
    language_switcher: false
    cta:
      enable: false
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: '© {year} 侯志伟'
  content:
    toc:
      enable: false
    reading_time:
      enable: false
    citations:
      style: ieee
  search:
    enable: false
  comments:
    enable: false
