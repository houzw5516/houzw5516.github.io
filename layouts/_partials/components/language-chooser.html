{{ $page := .page }}
{{ $class := .class }}
{{ if $page.IsTranslated }}
  {{ range $page.Translations }}
    <a
      href="{{ .Permalink }}"
      class="inline-flex items-center gap-2 h-7 rounded-md px-2 text-xs font-medium text-gray-600 transition-colors dark:text-gray-400 hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-primary-100/5 dark:hover:text-gray-50 {{ with $class }}{{ . | safeCSS }}{{ end }}"
      aria-label="{{ if eq .Lang "en" }}Switch to English{{ else }}Switch to Chinese{{ end }}"
    >
      {{- partial "functions/get_icon" (dict "name" "globe-alt" "attributes" "height=18") -}}
      <span>{{ if eq .Lang "en" }}English{{ else }}Chinese{{ end }}</span>
    </a>
  {{ end }}
{{ end }}
